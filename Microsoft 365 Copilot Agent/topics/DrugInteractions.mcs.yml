# Name: Drug Interactions
# ACTION TOPIC — Checks drug interactions via CareAssurance API.
# Operation: checkDrugInteractions (POST /api/copilot/check-drug-interactions)
kind: AdaptiveDialog
modelDescription: |
  This topic checks for drug-drug interactions. Ask the user for a list of medications,
  then use the CareAssurance API checkDrugInteractions action. Display all interactions
  found with severity levels, clinical significance, and recommendations.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Drug Interactions
    includeInOnSelectIntent: true
    triggerQueries:
      - drug interaction
      - check interactions
      - medication interaction
      - drug safety check
      - can these medications be taken together
      - medication clash
      - dangerous drug combination
      - drug interaction check
      - BNF interaction
      - polypharmacy check

  actions:
    - kind: Question
      id: medication-list
      alwaysPrompt: true
      variable: init:Topic.Medications
      prompt: |-
        I'll check for drug interactions. List the medications to check (at least 2), separated by commas.

        **Example:** Warfarin, Ibuprofen, Paracetamol, Ramipril
      entity: StringPrebuiltEntity

    - kind: SendActivity
      id: working
      activity: "Checking for drug interactions using UK BNF guidelines..."

    - kind: SearchAndSummarizeContent
      id: interaction-action
      variable: Topic.Result
      userInput: |-
        Execute the checkDrugInteractions action with medications=[{Topic.Medications}].
        Return all interactions found including drug pairs, severity (mild/moderate/severe/critical),
        clinical significance, and recommendations. Include a summary of the overall medication regimen safety.

    - kind: ConditionGroup
      id: result-check
      conditions:
        - id: has-result
          condition: =!IsBlank(Topic.Result)
          actions:
            - kind: SendActivity
              id: show-result
              activity: "{Topic.Result}"
        - id: no-result
          condition: =IsBlank(Topic.Result)
          actions:
            - kind: SendActivity
              id: fallback
              activity: "I couldn't complete the interaction check right now. The drug interaction check is also available within the EMAR Analysis results in CareAssurance."
