# Name: Billing Tool
# Handles service requirement billing extraction from uploaded images using vision AI,
# and support plan comparison against service orders.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Billing Tool
    includeInOnSelectIntent: true
    triggerQueries:
      - billing tool
      - billing
      - service requirements
      - extract billing
      - billing image
      - service requirement screenshot
      - upload billing
      - billing analysis
      - service hours
      - billing rows
      - billing extraction
      - support plan comparison
      - compare support plan
      - support plan vs service orders
      - service order mismatch
      - billing discrepancy
      - hours mismatch

  actions:
    - kind: SearchAndSummarizeContent
      id: billing-search
      variable: Topic.Answer
      userInput: =System.Activity.Text

    - kind: ConditionGroup
      id: billing-conditions
      conditions:
        - id: has-billing-answer
          condition: =!IsBlank(Topic.Answer)
          actions:
            - kind: SendActivity
              id: billing-response
              activity: "{Topic.Answer}"

            - kind: SendActivity
              id: billing-followup
              activity: Would you like help interpreting billing data or comparing a support plan?

      elseActions:
        - kind: SendActivity
          id: billing-guidance
          activity: |-
            I can help with billing and service requirement analysis. CareAssurance offers two tools:

            **📸 Billing Tool (Vision AI Extraction)**
            Upload a screenshot or image of service requirements and the AI will:
            - Extract all billing rows from the image using vision AI
            - Identify service types, hours, rates, and frequencies
            - Structure the data into a clean, editable format
            - Flag any rows that couldn't be confidently extracted

            **📊 Support Plan Comparison**
            Compare a support plan document against your actual service orders:
            - Upload the support plan (PDF/DOCX)
            - The system matches planned services against recorded service orders
            - Identifies mismatches: missing services, extra services, hour discrepancies
            - Generates a comparison report with recommendations

            **Where to find it:**
            - Billing Tool: **Billing Tool** page in CareAssurance
            - Support Plan Comparison: Available within the billing workflow

            **Tips:**
            - Ensure images are clear and high-resolution for best extraction
            - Support plan documents should include service types and allocated hours
            - Review extracted data before using it for invoicing

            Which would you like help with?
