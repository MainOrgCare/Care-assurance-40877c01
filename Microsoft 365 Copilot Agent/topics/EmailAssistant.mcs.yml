# Name: Email Assistant
# ACTION TOPIC — Executes email rewriting via CareAssurance API plugin.
# Operation: rewriteEmail (POST /api/copilot/rewrite-email)
kind: AdaptiveDialog
modelDescription: |
  This topic rewrites emails. Collect the desired tone and the draft text from the user,
  then use the CareAssurance API rewriteEmail action to generate the polished email.
  Display the full rewritten email text to the user.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Email Assistant
    includeInOnSelectIntent: true
    triggerQueries:
      - write an email
      - rewrite email
      - email assistant
      - draft email
      - professional email
      - formal email
      - urgent email
      - empathetic email
      - direct email
      - help me write
      - improve my email
      - make this more professional
      - polish this email
      - email to family
      - email to manager

  actions:
    - kind: Question
      id: email-tone
      alwaysPrompt: true
      variable: init:Topic.EmailTone
      prompt: |-
        I'll rewrite your email right now. What tone would you like?

        1. **Professional** - Standard business communication
        2. **Direct** - Clear, concise, to the point
        3. **Empathetic** - Warm and understanding (good for families)
        4. **Formal** - Official correspondence (CQC, local authority)
        5. **Urgent** - Time-sensitive, action-oriented
      entity: StringPrebuiltEntity

    - kind: Question
      id: email-content
      alwaysPrompt: true
      variable: init:Topic.EmailContent
      prompt: |-
        Paste your rough notes, bullet points, or draft text and I'll rewrite it in the **{Topic.EmailTone}** tone.
      entity: StringPrebuiltEntity

    - kind: SendActivity
      id: email-working
      activity: "Rewriting your email in **{Topic.EmailTone}** tone..."

    - kind: SearchAndSummarizeContent
      id: email-action
      variable: Topic.Result
      userInput: |-
        Execute the rewriteEmail action with tone={Topic.EmailTone} and inputText={Topic.EmailContent}. Generate a subject line. Return the complete rewritten email.

    - kind: ConditionGroup
      id: result-check
      conditions:
        - id: has-result
          condition: =!IsBlank(Topic.Result)
          actions:
            - kind: SendActivity
              id: show-result
              activity: "{Topic.Result}"
        - id: no-result
          condition: =IsBlank(Topic.Result)
          actions:
            - kind: SendActivity
              id: fallback
              activity: "I couldn't generate the email right now. Please try the Email Assistant page in CareAssurance directly."
