# Name: Email Assistant
# Handles email rewriting, drafting, and tone adjustment with 5 professional tones.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Email Assistant
    includeInOnSelectIntent: true
    triggerQueries:
      - write an email
      - rewrite email
      - email assistant
      - draft email
      - email tone
      - professional email
      - formal email
      - urgent email
      - empathetic email
      - direct email
      - help me write
      - improve my email
      - make this more professional
      - email template
      - email to family
      - email to manager
      - email to social worker
      - email subject line

  actions:
    - kind: Question
      id: email-tone-question
      alwaysPrompt: true
      variable: init:Topic.EmailTone
      prompt: |-
        I can help you write or rewrite an email. What tone would you like?

        1. **Professional** — Standard business communication
        2. **Direct** — Clear and concise, straight to the point
        3. **Empathetic** — Warm and understanding (good for families)
        4. **Formal** — Official correspondence (CQC, local authority)
        5. **Urgent** — Time-sensitive communication
      entity: StringPrebuiltEntity

    - kind: Question
      id: email-content-question
      alwaysPrompt: true
      variable: init:Topic.EmailContent
      prompt: |-
        Great! Now paste your rough notes, bullet points, or key messages and I'll transform them into a polished email.

        **Tips:**
        - Include the main points you want to communicate
        - Mention who the email is to (e.g. family member, manager, social worker)
        - Note any specific action items or deadlines
      entity: StringPrebuiltEntity

    - kind: SendActivity
      id: email-processing
      activity: |-
        ✅ I've noted your request. To generate the email:

        1. Go to the **Email Assistant** in CareAssurance (accessible from the sidebar)
        2. Paste your notes into the input field
        3. Select the **{Topic.EmailTone}** tone
        4. Optionally tick "Generate subject line"
        5. Click **Rewrite**

        The AI will transform your notes into a polished, well-structured email with:
        - Proper greeting and sign-off
        - UK English spelling
        - Professional formatting
        - Placeholders for names where needed

        **Remember:** Always review AI-generated emails before sending, especially for clinical or safeguarding content.

        Would you like help with anything else?
