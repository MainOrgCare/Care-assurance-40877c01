# Name: EMAR Audit
# ACTION TOPIC — Handles EMAR analysis and medication auditing.
# The full EMAR PDF analysis requires the web UI for file upload.
# This topic handles text-based EMAR queries, code lookups, and directs
# users to the Copilot API for document-based analysis.
kind: AdaptiveDialog
modelDescription: |
  This topic handles EMAR (Electronic Medication Administration Record) analysis.
  For text-based medication queries, use the chatWithCompliee action.
  For full EMAR PDF analysis, explain that the user should use the CareAssurance web app
  or provide the document text for analysis.
  Can also check drug interactions by routing to the checkDrugInteractions action.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: EMAR Audit
    includeInOnSelectIntent: true
    triggerQueries:
      - EMAR audit
      - medication audit
      - medication record
      - EMAR analysis
      - upload EMAR
      - medication discrepancy
      - missed dose
      - refused medication
      - medication administration
      - EMAR code
      - what does AD mean
      - what does NH mean
      - what does MU mean
      - what does SA mean
      - unsigned refusal
      - medication review
      - EMAR report
      - medication compliance
      - medication extraction

  actions:
    - kind: SendActivity
      id: emar-intro
      activity: |-
        I can help with EMAR and medication analysis!

        **What I can do right now:**
        - Answer questions about EMAR codes (AD, R, NH, SA, F, MU, PRN, etc.)
        - Check drug interactions between medications
        - Explain medication administration discrepancies
        - Help interpret EMAR audit results

        **For full EMAR PDF analysis**, paste the extracted text from your EMAR document below, or use the **EMAR Analysis** page in CareAssurance to upload the PDF directly for the complete multi-pass AI audit.

    - kind: SearchAndSummarizeContent
      id: emar-search
      variable: Topic.Answer
      userInput: =System.Activity.Text

    - kind: ConditionGroup
      id: emar-result
      conditions:
        - id: has-answer
          condition: =!IsBlank(Topic.Answer)
          actions:
            - kind: SendActivity
              id: show-answer
              activity: "{Topic.Answer}"
        - id: no-answer
          condition: =IsBlank(Topic.Answer)
          actions:
            - kind: SendActivity
              id: emar-fallback
              activity: |-
                I couldn't find specific information about that. Here are the EMAR codes for reference:

                | Code | Meaning |
                |------|---------|
                | AD | Administered |
                | R | Refused |
                | NH | Not Home |
                | SA | Self Administered |
                | F | Family Administered |
                | MU | Medication Unavailable |
                | PRN | As Needed |
                | MISSED | Missed dose (blank) |
                | AS | As Stated |
                | P | Prompted |

                Try asking about a specific code or medication query.
