# Name: Escalate
# This system topic is triggered when the user indicates they would like to speak
# to a representative. Configured with CareAssurance-specific escalation paths.
kind: AdaptiveDialog
startBehavior: CancelOtherTopics
beginDialog:
  kind: OnEscalate
  id: main
  intent:
    displayName: Escalate
    includeInOnSelectIntent: false
    triggerQueries:
      - Talk to agent
      - Talk to a person
      - Talk to someone
      - Call back
      - Call customer service
      - Call me please
      - Call support
      - Call technical support
      - Can I speak to a representative
      - Can I talk to a human
      - Connect me to a live agent
      - Connect me to a person
      - Customer service
