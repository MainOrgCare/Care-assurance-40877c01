      - I want to speak with a consultant
      - Talk to manager
      - Speak to supervisor
      - I need a care coordinator
      - Contact the office
      - Speak to admin

  actions:
    - kind: SendActivity
      id: sendMessage_escalate
      conversationOutcome: Escalated
      activity: |-
        I understand you'd like to speak with someone directly. Here are your options:

        **For CareAssurance Platform Support:**
        - Contact your organisation's CareAssurance administrator
        - Email support via the platform's help section

        **For Care-Related Concerns:**
        - Contact your **line manager** or **care coordinator** directly
        - For rostering/staffing queries, contact your **scheduling team**

        **For Safeguarding Concerns:**
        - Follow your organisation's safeguarding procedures
        - Contact CQC on **03000 616161** if needed
        - In an emergency, call **999**

        Is there anything else I can help you with in the meantime?
