# Name: Risk Assessment
# ACTION TOPIC — Executes risk analysis and assessment generation via CareAssurance API.
# Operations: analyzeRisks, generateRiskAssessment
kind: AdaptiveDialog
modelDescription: |
  This topic handles risk analysis and risk assessment generation. It can:
  1. Analyze documents to build a risk profile (analyzeRisks action)
  2. Generate a specific risk assessment for a category (generateRiskAssessment action)
  Ask the user for their documents and which operation they need, then execute the appropriate action.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Risk Assessment
    includeInOnSelectIntent: true
    triggerQueries:
      - risk assessment
      - analyze risks
      - risk profile
      - generate risk assessment
      - falls risk
      - medication risk
      - mobility risk
      - skin integrity risk
      - moving and handling risk
      - safeguarding risk
      - infection control risk
      - fire safety risk
      - environmental risk
      - what risks does this person have
      - identify risks
      - CQC risk assessment
      - NHS risk assessment

  actions:
    - kind: Question
      id: risk-type
      alwaysPrompt: true
      variable: init:Topic.RiskType
      prompt: |-
        I can help with risk assessments. What would you like me to do?

        1. **Analyze documents** - Scan service user documents to build a risk profile and recommend which assessments are needed
        2. **Generate assessment** - Create a specific risk assessment for a category (e.g. Falls, Medication, Mobility)
      entity: StringPrebuiltEntity

    - kind: Question
      id: document-content
      alwaysPrompt: true
      variable: init:Topic.DocumentContent
      prompt: |-
        Paste the service user documents below. This can include assessments, medical records, care notes, hospital discharge summaries, or any relevant documentation.
      entity: StringPrebuiltEntity

    - kind: SendActivity
      id: working
      activity: "Analyzing documents following CQC 2024 standards and NHS England 12 Principles..."

    - kind: SearchAndSummarizeContent
      id: risk-action
      variable: Topic.Result
      userInput: |-
        The user wants to {Topic.RiskType} from these documents.
        If they want to analyze/scan/identify risks, use the analyzeRisks action with documentContent={Topic.DocumentContent}.
        If they want to generate a specific risk assessment category, use the generateRiskAssessment action with category from their request and documentContent={Topic.DocumentContent}.
        Return the complete results including risk profile, medical conditions, recommended assessments, hazards, and action plans.

    - kind: ConditionGroup
      id: result-check
      conditions:
        - id: has-result
          condition: =!IsBlank(Topic.Result)
          actions:
            - kind: SendActivity
              id: show-result
              activity: "{Topic.Result}"
        - id: no-result
          condition: =IsBlank(Topic.Result)
          actions:
            - kind: SendActivity
              id: fallback
              activity: "I couldn't complete the risk analysis right now. Try the Risk Assessment page in CareAssurance directly."
