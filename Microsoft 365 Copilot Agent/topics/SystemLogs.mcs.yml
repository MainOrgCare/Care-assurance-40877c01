# Name: System Logs and Audit Trail
# Handles system event logs, audit trails, session history, and operational monitoring.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: System Logs and Audit Trail
    includeInOnSelectIntent: true
    triggerQueries:
      - system logs
      - audit trail
      - event log
      - activity log
      - login history
      - session history
      - who did what
      - track changes
      - system events
      - error log
      - system health
      - operations health
      - incidents
      - platform status
      - monitoring
      - uptime
      - system errors

  actions:
    - kind: SearchAndSummarizeContent
      id: logs-search
      variable: Topic.Answer
      userInput: =System.Activity.Text

    - kind: ConditionGroup
      id: logs-conditions
      conditions:
        - id: has-logs-answer
          condition: =!IsBlank(Topic.Answer)
          actions:
            - kind: SendActivity
              id: logs-response
              activity: "{Topic.Answer}"

      elseActions:
        - kind: SendActivity
          id: logs-guidance
          activity: |-
            I can help with system logs and auditing in CareAssurance.

            **📋 System Logs**
            Comprehensive event logging covering:
            - User actions (logins, logouts, data access)
            - AI operations (analyses started, completed, failed)
            - Admin actions (user changes, config updates)
            - System events (errors, warnings, maintenance)
            - Security events (blocked IPs, failed logins, suspensions)

            **🔍 Audit Trail**
            Full audit trail for compliance and governance:
            - Who performed each action
            - When the action occurred (UTC timestamps)
            - What was changed (before/after values where applicable)
            - IP address and session information
            - Filterable by user, action type, date range

            **📊 Operational Monitoring**
            | Feature | Description |
            |---------|-------------|
            | **System Health** | Overall platform health check |
            | **Incidents** | Log and track operational incidents |
            | **Session History** | Complete login/logout history per user |
            | **Suspension Logs** | Record of all user suspensions and reinstatements |
            | **GDPR Audit Logs** | Data protection-specific event trail |

            **Where to find it:**
            - System Logs: **System Logs** page (admin only)
            - Audit Trail: **Admin Portal → Audit Trail**
            - Session History: **Admin Portal → Session History**

            What log information are you looking for?
