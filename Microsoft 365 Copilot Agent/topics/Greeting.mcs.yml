# Name: Greeting
# This topic is triggered when the user greets the agent.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Greeting
    includeInOnSelectIntent: false
    triggerQueries:
      - Good afternoon
      - Good morning
      - Hello
      - Hey
      - Hi
      - Hiya
      - Alright

  actions:
    - kind: SendActivity
      id: sendMessage_abmysR
      activity:
        text:
          - |-
            Hello! 👋 I'm CareAssurance Copilot — ready to help with EMAR audits, care plans, risk assessments, visit audits, PRN protocols, email rewriting, call reconciliation, rostering, billing, GDPR, admin, and more.

            What would you like help with?
        speak:
          - Hello! I'm CareAssurance Copilot. How can I help you today?

    - kind: CancelAllDialogs
      id: cancelAllDialogs_01At22
