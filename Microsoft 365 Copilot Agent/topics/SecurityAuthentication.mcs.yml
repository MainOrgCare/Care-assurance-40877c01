# Name: Security and Authentication
# Handles login security, password policies, terms acceptance, demo mode, and session management.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Security and Authentication
    includeInOnSelectIntent: true
    triggerQueries:
      - security
      - login
      - password
      - change password
      - forgot password
      - locked out
      - can't login
      - login failed
      - authentication
      - two factor
      - terms and conditions
      - accept terms
      - digital signature
      - demo mode
      - demo login
      - session expired
      - session timeout
      - virus scan
      - file security
      - malware scan
      - upload security
      - password requirements
      - password policy
      - account locked

  actions:
    - kind: SearchAndSummarizeContent
      id: security-search
      variable: Topic.Answer
      userInput: =System.Activity.Text

    - kind: ConditionGroup
      id: security-conditions
      conditions:
        - id: has-security-answer
          condition: =!IsBlank(Topic.Answer)
          actions:
            - kind: SendActivity
              id: security-response
              activity: "{Topic.Answer}"

      elseActions:
        - kind: SendActivity
          id: security-guidance
          activity: |-
            I can help with security and authentication in CareAssurance.

            **🔐 Login Security**
            CareAssurance uses progressive lockout to protect accounts:
            | Failed Attempts | Consequence |
            |----------------|-------------|
            | **1-4** | Warning message shown |
            | **5** | Account locked for **15 minutes** |
            | **5 again** | Account locked for **4 hours** |
            | **Continued** | Account **auto-suspended** — requires admin reinstatement |

            **🔑 Password Requirements**
            - Minimum **12 characters**
            - At least one **uppercase** letter
            - At least one **lowercase** letter
            - At least one **digit**
            - At least one **special character** (!@#$%^&* etc.)
            - No sequential characters (abc, 123)
            - No common passwords
            - Cannot reuse recent passwords

            **📋 Terms & Conditions**
            - Users must accept terms with a **digital signature** before accessing the platform
            - Terms acceptance is recorded with timestamp and IP address
            - Terms can be updated by admin; users must re-accept updated terms

            **🎮 Demo Mode**
            - Access the platform in read-only mode without registration
            - Explore all features with sample data
            - No data modifications allowed
            - No account creation required

            **🛡️ File Security**
            - All uploaded files are scanned for viruses using Cloudmersive
            - Scan results are cached by file hash to avoid duplicate scans
            - Infected files are rejected with a clear error message

            **⏱️ Session Management**
            - Sessions timeout after **30 minutes** of inactivity
            - Rolling refresh extends the session with each interaction
            - Admins can force-disconnect any session
            - WebSocket-based real-time logout notification

            **🔧 Troubleshooting**
            - **Locked out?** Wait for the lockout period or contact your admin for reinstatement
            - **Session expired?** Log in again — your work is saved automatically
            - **Password rejected?** Ensure it meets all complexity requirements listed above
            - **Can't register?** Your registration is pending admin approval

            What security question do you have?
