    url: https://www.cqc.org.uk/guidance-providers

  - kind: Website
    displayName: NHS England Adult Social Care
    description: NHS England guidance on adult social care, person-centred care, and clinical standards.
    url: https://www.england.nhs.uk/ourwork/part-rel/adult-social-care/

  - kind: Website
    displayName: NICE Social Care Guidelines
    description: NICE guidelines relevant to adult social care, including medication, falls prevention, dementia, and end of life care.
    url: https://www.nice.org.uk/guidance/conditions-and-diseases

  - kind: File
    displayName: EMAR Code Reference
    description: Complete reference for all EMAR medication administration codes (AD, R, NH, SA, F, MU, PRN, MISSED, AS, P) with meanings and required actions.

  - kind: File
