    description: ECM call reconciliation variation codes (L1 Hospital, L4 Cancellation >24h, L5 Cancellation <24h, A1 Empty) with mapping rules.

  - kind: File
    displayName: Care Plan Section Guide
    description: Detailed guide to the 12 mandatory CQC 2024 care plan sections with content requirements and call-type variations.

  - kind: File
    displayName: Risk Assessment Category Guide
    description: Guide to the 20+ risk assessment categories with scope, hazards, and evidence requirements for each category.

  - kind: File
    displayName: Platform Quick Reference
    description: Quick reference guide covering all CareAssurance pages, workflows, shortcuts, and common tasks.

