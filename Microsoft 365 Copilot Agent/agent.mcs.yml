    displayName: Care Policies and Procedures
    description: Organisation care policies, procedures, medication guides, safeguarding protocols, H&S policies, infection control procedures, and HR policies.

  - kind: SharePoint
    displayName: CQC Regulatory Guidance
    description: CQC fundamental standards, inspection frameworks, Key Lines of Enquiry (KLOEs), quality statements, and regulatory compliance checklists.

  - kind: SharePoint
    displayName: Training and User Guides
    description: CareAssurance platform user guides, training materials, SOPs, quick reference cards, and onboarding packs.

  - kind: SharePoint
    displayName: Clinical and Medication Guidance
    description: Medication administration policies, PRN guidelines, BNF references, drug interaction resources, and clinical pathway documents.

  - kind: SharePoint
    displayName: GDPR and Data Protection
    description: Privacy notices, DPIA documents, data retention schedules, consent forms, data processor agreements, and information governance policies.

  - kind: SharePoint
    displayName: Risk Assessment Templates and Frameworks
    description: Risk assessment frameworks, category-specific guidance, NHS England 12 Principles, and Moving & Handling assessment standards.

  - kind: Website
