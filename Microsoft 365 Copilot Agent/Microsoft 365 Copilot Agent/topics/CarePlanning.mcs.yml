# Name: Care Planning
# Handles care plan generation (12 sections, call-type aware), enhancement,
# CQC 2024 compliance, and care plan merging with supporting documents.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Care Planning
    includeInOnSelectIntent: true
    triggerQueries:
      - care plan
      - care planning
      - create care plan
      - generate care plan
      - enhance care plan
      - improve care plan
      - care plan sections
      - CQC compliance
      - CQC care plan
      - morning care plan
      - lunch care plan
      - tea care plan
      - bed care plan
      - domestic care plan
      - call type plan
      - personal care plan
      - nutrition care plan
      - mobility care plan
      - mental health care plan
      - continence care plan
      - skin integrity care plan
      - medication management plan
      - communication plan
      - household tasks plan
      - end of life care plan
      - missing care plan section
      - upload care plan
      - plan enhancer
      - merge care plan
      - care plan from documents

  actions:
    - kind: SearchAndSummarizeContent
      id: careplan-search
      variable: Topic.Answer
      userInput: =System.Activity.Text

    - kind: ConditionGroup
      id: careplan-conditions
      conditions:
        - id: has-careplan-answer
          condition: =!IsBlank(Topic.Answer)
          actions:
            - kind: SendActivity
              id: careplan-response
              activity: "{Topic.Answer}"

            - kind: SendActivity
              id: careplan-followup
              activity: Would you like help with a specific section, call type, or the plan enhancement feature?

      elseActions:
        - kind: SendActivity
          id: careplan-guidance
          activity: |-
            I can help with care planning. CareAssurance offers two AI-powered modes:

            **📝 Generate New Care Plan**
            Creates a CQC 2024-compliant plan with 12 mandatory sections:
            1. Warning/Safety Information
            2. Introduction/Life Story
            3. Well-being & Mental Health
            4. Social Worker Tasks
            5. Personal Care & Hygiene
            6. Mobility & Transfers
            7. Nutrition & Hydration
            8. Medication Management
            9. Continence Care
            10. Communication Needs
            11. Household Tasks
            12. Secure Property

            **📅 Call-Type Specific Plans:**
            | Type | Focus |
            |------|-------|
            | **Morning** | Wake-up, medication, personal care, breakfast |
            | **Lunch** | Midday medication, meal prep, welfare check |
            | **Tea** | Afternoon medication, evening meal, activities |
            | **Bed** | Night medication, personal care, secure property |
            | **Domestic** | Cleaning, laundry, shopping, household |
            | **General** | All-encompassing plan |

            **🔄 Enhance Existing Plan**
            Upload an existing care plan + supporting documents (M&H assessments, GP letters, medical records). The AI will:
            - Merge evidence from all documents
            - Fill gaps with professional defaults
            - Flag missing info as verification questions
            - Follow CQC 2024, NICE guidelines, NHS Person-Centred Care standards

            **Where to go:**
            - New plans: **Service Users → Care Planning**
            - Enhance existing: **Service Users → Plan Enhancer**

            Which would you like help with?
