# Name: Risk Assessment
# Handles AI risk analysis (document scanning with PII Vault), risk assessment generation,
# and 20+ assessment categories following CQC 2024 and NHS England standards.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Risk Assessment
    includeInOnSelectIntent: true
    triggerQueries:
      - risk assessment
      - risk analysis
      - falls risk
      - medication risk
      - skin integrity risk
      - moving and handling
      - fire safety assessment
      - lone working risk
      - behaviour support
      - dementia care assessment
      - mandatory risk assessment
      - service user risk
      - risk recommendations
      - assess risk
      - risk score
      - risk level
      - safety assessment
      - generate risk assessment
      - upload for risk analysis
      - document scanning
      - diabetes management risk
      - epilepsy management risk
      - infection control
      - COSHH assessment
      - environmental safety
      - continence care risk
      - nutrition risk
      - communication risk
      - mental health risk
      - end of life risk
      - safeguarding risk

  actions:
    - kind: SearchAndSummarizeContent
      id: risk-search
      variable: Topic.Answer
      userInput: =System.Activity.Text

    - kind: ConditionGroup
      id: risk-conditions
      conditions:
        - id: has-risk-answer
          condition: =!IsBlank(Topic.Answer)
          actions:
            - kind: SendActivity
              id: risk-response
              activity: "{Topic.Answer}"

            - kind: SendActivity
              id: risk-followup
              activity: Would you like help with a specific assessment category, or guidance on interpreting AI recommendations?

      elseActions:
        - kind: SendActivity
          id: risk-guidance
          activity: |-
            I can help with risk assessments. CareAssurance has two AI-powered stages:

            **🔍 Stage 1: Document Scanning (Risk Analysis)**
            Upload service user documents → AI scans and builds a person-centred risk profile:
            - Follows **CQC 2024** standards and **NHS England's 12 Principles**
            - PII is scrubbed via PIIVault before AI processing (clinical terms preserved)
            - Templates are excluded — only real documented evidence used
            - Extracts: medical conditions, care activities, concerns, equipment, communication needs, environmental factors
            - Recommends which assessments are **mandatory** vs **optional**

            **📋 Stage 2: Risk Assessment Generation**
            Generates detailed, category-specific assessments:
            - Written in **first person** as the service user
            - Evidence-based — zero fabrication policy
            - Includes: hazards, risk ratings, control measures, action plans
            - Respects care worker scope-of-practice limits

            **20+ Assessment Categories:**
            | Category | Category |
            |----------|----------|
            | Falls Prevention | Medication Administration |
            | Skin Integrity | Mobility & Moving/Handling |
            | Personal Care | Continence Care |
            | Nutrition | Communication |
            | Mental Health | Dementia Care |
            | Behaviour Support | End of Life Care |
            | Fire Safety | Environmental Safety |
            | Lone Working | Safeguarding |
            | Infection Control | COSHH |
            | Diabetes Management | Epilepsy Management |

            **Where to go:** **Service Users → Risk Assessment** to upload documents and start.

            Which assessment category or stage would you like help with?
