# Name: Thank you
# This topic triggers when the user says thank you.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Thank you
    includeInOnSelectIntent: false
    triggerQueries:
      - thanks
      - thank you
      - thanks so much
      - ty
      - ta
      - cheers
      - much appreciated
      - that's helpful

  actions:
    - kind: SendActivity
      id: sendMessage_9iz6v7
      activity: |-
        You're welcome! Is there anything else I can help you with?

        I'm here to assist with EMAR audits, care plans, risk assessments, rostering, billing, GDPR, and all CareAssurance platform features.
