# Name: ROI Calculator
# Handles return on investment calculations and cost savings analysis.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: ROI Calculator
    includeInOnSelectIntent: true
    triggerQueries:
      - ROI calculator
      - return on investment
      - cost savings
      - how much does it save
      - is it worth it
      - calculate ROI
      - savings calculator
      - cost benefit
      - platform value
      - time savings
      - efficiency gains
      - business case

  actions:
    - kind: SearchAndSummarizeContent
      id: roi-search
      variable: Topic.Answer
      userInput: =System.Activity.Text

    - kind: ConditionGroup
      id: roi-conditions
      conditions:
        - id: has-roi-answer
          condition: =!IsBlank(Topic.Answer)
          actions:
            - kind: SendActivity
              id: roi-response
              activity: "{Topic.Answer}"

      elseActions:
        - kind: SendActivity
          id: roi-guidance
          activity: |-
            I can help you understand the ROI Calculator in CareAssurance.

            **📈 What It Calculates**
            The ROI Calculator estimates the financial and time benefits of using CareAssurance, including:

            | Area | What's Measured |
            |------|----------------|
            | **EMAR Audit Time** | Hours saved vs manual medication record review |
            | **Care Plan Generation** | Time saved creating CQC-compliant care plans |
            | **Risk Assessment** | Hours saved on document scanning and assessment writing |
            | **Visit Audit** | Time saved on manual visit log compliance checking |
            | **Call Reconciliation** | Hours saved processing ECM spreadsheets |
            | **Email Writing** | Time saved drafting professional emails |
            | **Admin Tasks** | Reduced overhead from automated alerts and reporting |

            **💰 Inputs Required**
            - Number of service users
            - Number of care workers
            - Average audits per month
            - Current time spent on manual processes
            - Staff hourly rates

            **📊 Output**
            - Estimated monthly/annual time savings
            - Cost savings in £
            - Break-even timeline
            - Efficiency improvement percentage

            **Where to find it:** **ROI Calculator** page in CareAssurance.

            Would you like help running a calculation?
