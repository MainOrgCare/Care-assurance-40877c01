# Name: On Error
# This system topic triggers when the agent encounters an error.
# When using the test chat pane, the full error description is displayed.
kind: AdaptiveDialog
startBehavior: UseLatestPublishedContentAndCancelOtherTopics
beginDialog:
  kind: OnError
  id: main
  actions:
    - kind: SetVariable
      id: setVariable_timestamp
      variable: init:Topic.CurrentTime
      value: =Text(Now(), DateTimeFormat.UTC)

    - kind: ConditionGroup
      id: condition_1
      conditions:
        - id: bL4wmY
          condition: =System.Conversation.InTestMode = true
          actions:
            - kind: SendActivity
              id: sendMessage_XJBYMo
              activity: |-
                **⚠️ Error Details (Test Mode)**
                Error Message: {System.Error.Message}
                Error Code: {System.Error.Code}
                Conversation Id: {System.Conversation.Id}
                Time (UTC): {Topic.CurrentTime}

      elseActions:
        - kind: SendActivity
          id: sendMessage_dZ0gaF
          activity:
            text:
              - |-
                I'm sorry, something went wrong on my end. Please try again.

                If the issue persists, contact your CareAssurance administrator.

                Error reference: {System.Error.Code}
                Conversation: {System.Conversation.Id}
                Time: {Topic.CurrentTime}
