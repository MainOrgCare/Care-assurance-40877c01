# Name: Care Planning
# ACTION TOPIC — Generates and enhances care plans via CareAssurance API.
# Operations: generateCarePlan, enhanceCarePlan
kind: AdaptiveDialog
modelDescription: |
  This topic handles care plan generation and enhancement. It can:
  1. Generate a new 12-section care plan from service user documents (generateCarePlan action)
  2. Enhance an existing care plan with supporting documents (enhanceCarePlan action)
  Ask the user for their documents and what they need, then execute the appropriate action.
  Return the complete care plan with all sections, verification questions, and summary.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Care Planning
    includeInOnSelectIntent: true
    triggerQueries:
      - care plan
      - generate care plan
      - create care plan
      - write care plan
      - enhance care plan
      - improve care plan
      - update care plan
      - morning care plan
      - bedtime care plan
      - lunch care plan
      - tea care plan
      - domestic care plan
      - care plan sections
      - person centred care plan
      - CQC care plan

  actions:
    - kind: Question
      id: plan-type
      alwaysPrompt: true
      variable: init:Topic.PlanAction
      prompt: |-
        I can help with care plans. What would you like?

        1. **Generate new** - Create a complete 12-section care plan from service user documents
        2. **Enhance existing** - Improve an existing care plan using additional supporting documents
      entity: StringPrebuiltEntity

    - kind: Question
      id: call-type
      alwaysPrompt: true
      variable: init:Topic.CallType
      prompt: |-
        What call type is this care plan for?

        - **Morning** - Wake up, personal care, breakfast, morning medications
        - **Lunch** - Meal preparation, hydration, repositioning
        - **Tea** - Afternoon care, snacks, wellness check
        - **Bed** - Evening routine, night medications, bed transfer, security
        - **Domestic** - Cleaning, laundry, shopping, meal preparation
        - **General** - All-purpose care plan covering everything
      entity: StringPrebuiltEntity

    - kind: Question
      id: document-content
      alwaysPrompt: true
      variable: init:Topic.DocumentContent
      prompt: |-
        Paste the service user documents below. Include assessments, medical records, care notes, social worker instructions, and any existing care plan content.
      entity: StringPrebuiltEntity

    - kind: SendActivity
      id: working
      activity: "Generating **{Topic.CallType}** care plan following CQC 2024 standards..."

    - kind: SearchAndSummarizeContent
      id: plan-action
      variable: Topic.Result
      userInput: |-
        The user wants to {Topic.PlanAction} a care plan.
        Call type: {Topic.CallType}
        If generating a new care plan, use the generateCarePlan action with documentContent={Topic.DocumentContent} and callType={Topic.CallType}.
        If enhancing an existing plan, use the enhanceCarePlan action with existingPlanContent and documentContent from {Topic.DocumentContent}.
        Return the complete care plan with all 12 mandatory sections, verification questions, and summary.

    - kind: ConditionGroup
      id: result-check
      conditions:
        - id: has-result
          condition: =!IsBlank(Topic.Result)
          actions:
            - kind: SendActivity
              id: show-result
              activity: "{Topic.Result}"
        - id: no-result
          condition: =IsBlank(Topic.Result)
          actions:
            - kind: SendActivity
              id: fallback
              activity: "I couldn't generate the care plan right now. Try the Care Plan page in CareAssurance directly."
