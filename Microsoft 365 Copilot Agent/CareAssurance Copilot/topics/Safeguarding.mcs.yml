# Name: Safeguarding
# Handles safeguarding concerns, reporting procedures, and urgent safety situations.
kind: AdaptiveDialog
startBehavior: CancelOtherTopics
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Safeguarding
    includeInOnSelectIntent: true
    triggerQueries:
      - safeguarding
      - safeguarding concern
      - abuse
      - neglect
      - harm
      - service user at risk
      - vulnerable adult
      - report concern
      - safeguarding procedure
      - duty of care
      - urgent safety
      - incident report

  actions:
    - kind: SendActivity
      id: safeguarding-warning
      activity: |-
        ⚠️ **Safeguarding Notice**

        If you believe a service user is at **immediate risk of harm**, please:

        1. **Call 999** if there is an immediate danger to life
        2. **Contact your local safeguarding board** to report the concern
        3. **Notify your line manager** and follow your organisation's safeguarding policy
        4. **Contact CQC** on 03000 616161 if you need to report a concern about a registered provider

        **Important:** Document the concern factually, including:
        - Date and time of the incident or disclosure
        - What was observed or disclosed (using the person's own words where possible)
        - Any witnesses present
        - Actions taken

        I can provide guidance on safeguarding procedures, but **I cannot report concerns on your behalf**. All safeguarding referrals must go through your organisation's designated safeguarding lead.

    - kind: Question
      id: safeguarding-followup
      alwaysPrompt: true
      variable: init:Topic.NeedMoreHelp
      prompt: Would you like more information about safeguarding procedures or reporting?
      entity: BooleanPrebuiltEntity

    - kind: ConditionGroup
      id: safeguarding-condition
      conditions:
        - id: safeguarding-yes
          condition: =Topic.NeedMoreHelp = true
          actions:
            - kind: SendActivity
              id: safeguarding-detail
              activity: |-
                **Key Safeguarding Principles (Care Act 2014):**
                - **Empowerment** — Presume the person can make their own decisions
                - **Prevention** — Act before harm occurs
                - **Proportionality** — Respond proportionally to the risk
                - **Protection** — Support those most at risk
                - **Partnership** — Work with local services
                - **Accountability** — Be transparent and accountable

                Your organisation's safeguarding lead should be your first point of contact for any concerns.

      elseActions:
        - kind: SendActivity
          id: safeguarding-close
          activity: Understood. Remember, safeguarding is everyone's responsibility. Is there anything else I can help with?
