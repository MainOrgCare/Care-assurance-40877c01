# Name: Conversation Start
# This system topic triggers when the agent receives an Activity indicating the
# beginning of a new conversation.
kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: SendActivity
      id: sendMessage_M0LuhV
      activity:
        text:
          - |-
            Hello! I'm **CareAssurance Copilot** — your AI assistant for healthcare compliance and operations. 📋

            Here's everything I can help you with:

            **🔬 AI-Powered Analysis**
            - **EMAR Audit** — 6-pass AI medication record analysis with drug interaction detection
            - **Visit Audit** — Triple-check validated visit log compliance auditing
            - **Risk Analysis** — AI document scanning with PII protection for risk profiling
            - **Drug Interactions** — Automated medication safety checking

            **📝 AI Content Generation**
            - **Care Plans** — 12-section CQC 2024-compliant plans (Morning/Lunch/Tea/Bed/Domestic)
            - **Plan Enhancement** — Merge existing plans with supporting documents
            - **Risk Assessments** — Evidence-based, first-person assessments across 20+ categories
            - **PRN Protocols** — Clinically accurate as-needed medication protocols
            - **Email Rewriter** — Polish rough notes into professional emails (5 tones)

            **📊 Operations & Compliance**
            - **Call Reconciliation** — ECM Excel processing with variation codes
            - **Performance Tracking** — Discrepancy metrics, alerts, corrective actions
            - **Rostering** — Rota planning, schedule optimisation, workload analysis
            - **GDPR & Privacy** — Data protection, DSARs, consent management
            - **Safeguarding** — Urgent safety procedures and contacts

            **🏢 Administration & Platform**
            - **Billing Tool** — Service requirement extraction from images
            - **Support Plan Comparison** — Compare support plans vs service orders
            - **Dashboard** — Customisable widgets and activity feeds
            - **User Management** — Accounts, sessions, suspensions, IP blocking
            - **AI Configuration** — Provider settings, optimisation, usage tracking
            - **Messaging** — Internal messages and Compli-ee chat
            - **System Logs** — Audit trails and event logs
            - **Policy Documents** — Upload and manage care policies
            - **Edge Extension** — Browser extension for Access Care Planning auto-fill
            - **ROI Calculator** — Return on investment analysis
            - **Compliance** — Policy library and compliance overview

            How can I help you today?
        speak:
          - Hello! Welcome to CareAssurance Copilot. I can help with EMAR audits, visit audits, care planning, risk assessments, PRN protocols, email writing, call reconciliation, rostering, billing, GDPR, admin, and much more. Please note that AI-generated responses should be verified for clinical accuracy. How can I help you today?
