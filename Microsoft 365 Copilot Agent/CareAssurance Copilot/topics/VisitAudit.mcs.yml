# Name: Visit Audit
# ACTION TOPIC — Executes visit log auditing via CareAssurance API.
# Operation: analyzeVisitLogs (POST /api/copilot/analyze-visit)
kind: AdaptiveDialog
modelDescription: |
  This topic audits care visit logs. Ask the user to paste their visit log content,
  then use the CareAssurance API analyzeVisitLogs action to perform a compliance audit.
  Display the full audit results including discrepancies, compliance rates, themes, and training gaps.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Visit Audit
    includeInOnSelectIntent: true
    triggerQueries:
      - visit audit
      - audit visit logs
      - carer visit check
      - visit compliance
      - visit log analysis
      - check visit times
      - visit duration check
      - location compliance
      - missed visit
      - late visit
      - short visit
      - visit discrepancy
      - audit care calls
      - check carer attendance

  actions:
    - kind: Question
      id: visit-content
      alwaysPrompt: true
      variable: init:Topic.VisitContent
      prompt: |-
        I'll audit your visit logs for compliance. Paste the visit log content below.

        This should include visit entries with dates, times, care worker names, durations, and care notes. You can paste from a VisitExport.csv or similar report.
      entity: StringPrebuiltEntity

    - kind: SendActivity
      id: working
      activity: "Auditing visit logs for compliance - checking location, duration, note quality and concerns..."

    - kind: SearchAndSummarizeContent
      id: visit-action
      variable: Topic.Result
      userInput: |-
        Execute the analyzeVisitLogs action with documentContent={Topic.VisitContent}.
        Return the full audit results including: service user initials, audit period,
        whether discrepancies were found, all care calls with compliance status,
        all discrepancies with recommended actions, themes and trends, and gaps in knowledge.

    - kind: ConditionGroup
      id: result-check
      conditions:
        - id: has-result
          condition: =!IsBlank(Topic.Result)
          actions:
            - kind: SendActivity
              id: show-result
              activity: "{Topic.Result}"
        - id: no-result
          condition: =IsBlank(Topic.Result)
          actions:
            - kind: SendActivity
              id: fallback
              activity: "I couldn't complete the audit right now. Try using the Visit Audit page in CareAssurance directly."
