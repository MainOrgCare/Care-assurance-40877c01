services:
  - type: web
    runtime: static
    name: care-assurance-web
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build:client
    staticPublishPath: dist/public
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

  - type: web
    name: care-assurance-api
    runtime: node
    plan: standard
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build:server
    startCommand: npm run start:api
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_CANONICAL_REDIRECT
        value: "false"
      - key: SERVE_STATIC
        value: "false"
      - key: CORS_ORIGIN
        sync: false
      # Optional overrides; defaults exist in code. Prefer setting in Render dashboard.
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_FROM
        sync: false
      # Set these in the Render dashboard (do not commit secrets):
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # If you use Postgres, set DATABASE_URL in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Local LLM URL - Ollama service running on Render
      - key: LOCAL_LLM_URL
        value: "https://local-llm-mr51.onrender.com"

  - type: worker
    name: care-assurance-worker
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build:worker
    startCommand: npm run start:worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLEANUP_INTERVAL_MS
        sync: false
      - key: DATABASE_URL
        sync: false

  # Local LLM Service - Phi-3 Mini via Ollama
  # Keep data completely local - no external API calls
  - type: web
    name: local-llm
    runtime: docker
    dockerfilePath: ./Dockerfile.localllm
    plan: pro-plus
    healthCheckPath: /api/tags
    autoDeploy: true
    envVars:
      - key: OLLAMA_HOST
        value: "0.0.0.0:11434"
      - key: OLLAMA_KEEP_ALIVE
        value: "24h"
