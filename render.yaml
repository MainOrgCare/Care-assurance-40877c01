services:
  - type: web
    name: care-assurance
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Optional overrides; defaults exist in code. Prefer setting in Render dashboard.
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_FROM
        sync: false
      # Set these in the Render dashboard (do not commit secrets):
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # If you use Postgres, set DATABASE_URL in the dashboard.
      - key: DATABASE_URL
        sync: false
