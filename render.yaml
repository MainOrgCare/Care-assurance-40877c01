version: "1"

services:
  - type: web
    name: care-assurance
    runtime: node
    plan: standard
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build
    startCommand: npm run start:api
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_CANONICAL_REDIRECT
        value: "false"
      - key: SERVE_STATIC
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_ENABLED
        value: "true"
      - key: PORT
        value: "5000"
      
      # Database connection (set in dashboard)
      - key: DATABASE_URL
        sync: false
      - key: PGSSLREJECTUNAUTHORIZED
        value: "false"

      # Optional overrides
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CLOUDMERSIVE_API_KEY
        sync: false
      
      # AI provider keys
      - key: PAT_AI_KEY
        sync: false
      - key: AZURE_OPENAI_API_INSTANCE_NAME
        sync: false
      - key: AZURE_OPENAI_API_DEPLOYMENT_NAME
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: "2024-02-15-preview"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_FALLBACK_API_KEY
        sync: false

