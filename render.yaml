version: "1"

# ══════════════════════════════════════════════════════════════════════════════
# RENDER BLUEPRINT — Care Assurance
# Matches the actual Render dashboard layout:
#   Database group : Care-Assurance-Database  (PostgreSQL 18, Frankfurt)
#   Development    : Care-assurance-development  (Node, Frankfurt — single service)
#   Production     : Care-assurance-web  (Static, Global CDN)
#                    Care-assurance-api  (Node, Frankfurt)
#                    Care-assurance-worker  (Node, Frankfurt)
#                    CORS  (Env Group — 2 vars shared by api + web)
# ══════════════════════════════════════════════════════════════════════════════

# ── Managed PostgreSQL database ──────────────────────────────────────────────
databases:
  - name: Care-Assurance-Database
    plan: Basic-256mb
    region: frankfurt
    postgresMajorVersion: 18
    # DATABASE_URL is auto-wired to services via fromDatabase (see below).

# ── Shared env group (Production) ────────────────────────────────────────────
# Matches the "CORS" env group visible in the Production environment on Render.
# Contains 2 vars shared between Care-assurance-api and Care-assurance-web.
envVarGroups:
  - name: CORS
    envVars:
      - key: CORS_ORIGIN
        sync: false
        # Comma-separated origins, e.g. https://careassurance.uk,https://www.careassurance.uk
      - key: CANONICAL_DOMAIN
        sync: false
        # Primary domain without protocol, e.g. careassurance.uk
        # Used in Helmet CSP connect-src and CSRF origin checks.

services:
  # ── NODE.JS HEAP SIZE FOR BUILDS ──────────────────────────────────────────
  # All buildCommands export NODE_OPTIONS for the full command chain to prevent OOM errors:
  #   - Web build (Vite + React): 2048 MB (large dependencies, bundle optimization)
  #   - API & Worker builds (esbuild): 1024 MB (adequate for bundle)
  #   - Dev build (full: Vite + esbuild): 2048 MB (runs all three builds sequentially)
  # Inline VAR=value only scopes the first command, so use sh -c with export here.
  # Without this, vite build falls back to the runtime 512 MB limit and OOMs after 12-15s.
  # Runtime NODE_OPTIONS (512MB) is separate and sufficient for steady-state traffic.
  #
  # ── Production — Static CDN frontend ───────────────────────────────────────
  - type: web
    runtime: static
    name: care-assurance-web
    buildCommand: sh -c 'export NODE_OPTIONS=--max-old-space-size=2048; npm ci --include=dev --legacy-peer-deps && npm run build:client'
    staticPublishPath: dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
        # Set to the production API URL, e.g. https://care-assurance-api.onrender.com
        # The SPA uses this at build time to know where to send API calls.

  # ── Production — Node API ───────────────────────────────────────────────────
  # RESTful API backend serving the web app and any external integrations.
  #
  # Health endpoints:
  #   /healthz         — Lightweight liveness probe (always 200 if process alive)
  #   /readyz          — Checks database connectivity (503 if disconnected — no traffic routed)
  #   /status          — Comprehensive diagnostics (uptime, memory, DB latency, environment)
  #
  # Performance:
  #   - Global rate limiting: 1000 req/15min per IP (polling endpoints exempted)
  #   - Auth endpoints: 20 req/2min per IP (brute-force protection)
  #   - Admin endpoints: 10 req/hour per IP (sensitive action throttling)
  #   - Compression enabled (gzip for text, skipped for SSE streams)
  #   - Request ID tracking for debugging production issues
  #
  # Monitoring:
  #   - Visit /status endpoint regularly from a monitoring service to catch degradation
  #   - Check logs for "[worker]" messages if worker tasks fail (see Care-assurance-worker)
  #   - Monitor DATABASE_URL connectivity — /readyz will return 503 on connection loss
  #
  - type: web
    name: care-assurance-api
    runtime: node
    region: frankfurt
    plan: standard
    buildCommand: sh -c 'export NODE_OPTIONS=--max-old-space-size=1024; npm ci --include=dev --legacy-peer-deps && npm run build:server'
    startCommand: npm run start:api
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # ── Shared env group ──────────────────────────────────────────────────
      - fromGroup: CORS
        # Injects CORS_ORIGIN and CANONICAL_DOMAIN from the shared CORS env group.

      # ── Runtime ───────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=512

      # ── Network ───────────────────────────────────────────────────────────
      - key: SERVE_STATIC
        value: "false"
        # Static files served by Care-assurance-web; API handles /api routes only.
      - key: ENABLE_CANONICAL_REDIRECT
        value: "false"
        # Set to "true" once your custom domain is fully verified in Render.

      # ── Database ──────────────────────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: Care-Assurance-Database
          property: connectionString
        # Auto-wired from the Render-managed Care-Assurance-Database.
        # Uses the internal connection string (stays within Render's network).
      - key: PGSSLMODE
        value: require
      - key: PGSSLREJECTUNAUTHORIZED
        value: "false"

      # ── Session ───────────────────────────────────────────────────────────
      - key: SESSION_SECRET
        sync: false
        # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"

      # ── Admin bootstrap ───────────────────────────────────────────────────
      - key: ADMIN_BOOTSTRAP_USERNAME
        sync: false
        # Username for the initial admin account. Only runs if no admin exists yet.
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
        # Password for the initial admin account (min 12 chars). Required in production.

      # ── AI features ───────────────────────────────────────────────────────
      - key: AI_ENABLED
        value: "true"
      - key: PAT_AI_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_FALLBACK_API_KEY
        sync: false
      - key: OPENAI_FALLBACK_BASE_URL
        sync: false
        # Defaults to https://api.openai.com/v1. Override for Azure OpenAI or a proxy.

      # ── File scanning ─────────────────────────────────────────────────────
      - key: CLOUDMERSIVE_API_KEY
        sync: false

      # ── Email / SMTP ──────────────────────────────────────────────────────
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # ── Production — Background worker ───────────────────────────────────────
  # Autonomous background job processor running on a separate process to handle
  # scheduled maintenance tasks without impacting API performance.
  #
  # Current responsibilities (runs every CLEANUP_INTERVAL_MS):
  #   1. Data cleanup: Removes expired service users, care workers, calls, orders, templates, recommendations
  #   2. Session cleanup: Removes stale active sessions (inactive 7+ days)
  #   3. Suspension reset: Auto-reinstates users whose suspension period has expired
  #   4. IP block cleanup: Removes expired IP blocks (older than 30 days)
  #   5. System log archival: Identifies system logs eligible for long-term archive (90+ days old)
  #
  # Design: Sequential task execution (not parallel) to minimize database contention.
  # Logs detailed progress for each task — monitor logs to verify maintenance is running.
  #
  - type: worker
    name: care-assurance-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: sh -c 'export NODE_OPTIONS=--max-old-space-size=1024; npm ci --include=dev --legacy-peer-deps && npm run build:worker'
    startCommand: npm run start:worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLEANUP_INTERVAL_MS
        sync: false
        # How often the worker runs all maintenance tasks, in milliseconds.
        # Default: 21600000 (6 hours). Runs immediately on startup, then periodically.
        # Common values:
        #   - 3600000 = 1 hour (frequent, for active platforms)
        #   - 21600000 = 6 hours (balanced, default)
        #   - 86400000 = 24 hours (low-frequency, for off-peak times)
      - key: DATABASE_URL
        fromDatabase:
          name: Care-Assurance-Database
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: PGSSLREJECTUNAUTHORIZED
        value: "false"

