<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <!-- VERSION 3: Anime style, sparkle effects, heart cheeks -->
  <defs>
    <linearGradient id="tunic3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>
    <linearGradient id="hair3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF9C3"/>
      <stop offset="100%" style="stop-color:#FACC15"/>
    </linearGradient>
    <linearGradient id="skin3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFAF0"/>
      <stop offset="100%" style="stop-color:#FFE8D6"/>
    </linearGradient>
    <linearGradient id="eye3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#93C5FD"/>
      <stop offset="40%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Hair back -->
  <ellipse cx="50" cy="20" rx="37" ry="16" fill="url(#hair3)"/>
  
  <!-- Big round face -->
  <circle cx="50" cy="36" r="33" fill="url(#skin3)"/>
  
  <!-- Bouncy hair -->
  <ellipse cx="26" cy="16" rx="14" ry="13" fill="url(#hair3)"/>
  <ellipse cx="50" cy="10" rx="18" ry="14" fill="url(#hair3)"/>
  <ellipse cx="74" cy="16" rx="14" ry="13" fill="url(#hair3)"/>
  <ellipse cx="36" cy="18" rx="10" ry="9" fill="url(#hair3)"/>
  <ellipse cx="64" cy="18" rx="10" ry="9" fill="url(#hair3)"/>
  <!-- Shine strands -->
  <ellipse cx="38" cy="10" rx="5" ry="3" fill="white" opacity="0.7"/>
  <ellipse cx="56" cy="8" rx="6" ry="3" fill="white" opacity="0.7"/>
  <ellipse cx="70" cy="12" rx="4" ry="2" fill="white" opacity="0.5"/>
  
  <!-- BIG ANIME EYES -->
  <!-- Left eye -->
  <ellipse cx="35" cy="40" rx="12" ry="14" fill="white"/>
  <ellipse cx="37" cy="42" rx="9" ry="11" fill="url(#eye3)"/>
  <ellipse cx="38" cy="45" rx="4.5" ry="5.5" fill="#1E3A8A"/>
  <!-- Multiple sparkles -->
  <circle cx="43" cy="34" r="4.5" fill="white" filter="url(#glow)"/>
  <circle cx="32" cy="48" r="2.5" fill="white"/>
  <circle cx="44" cy="42" r="2" fill="white" opacity="0.9"/>
  <circle cx="35" cy="36" r="1.5" fill="white" opacity="0.7"/>
  
  <!-- Right eye -->
  <ellipse cx="65" cy="40" rx="12" ry="14" fill="white"/>
  <ellipse cx="67" cy="42" rx="9" ry="11" fill="url(#eye3)"/>
  <ellipse cx="68" cy="45" rx="4.5" ry="5.5" fill="#1E3A8A"/>
  <!-- Multiple sparkles -->
  <circle cx="73" cy="34" r="4.5" fill="white" filter="url(#glow)"/>
  <circle cx="62" cy="48" r="2.5" fill="white"/>
  <circle cx="74" cy="42" r="2" fill="white" opacity="0.9"/>
  <circle cx="65" cy="36" r="1.5" fill="white" opacity="0.7"/>
  
  <!-- Heart cheeks! -->
  <path d="M18 48 C18 45 21 44 22 46 C23 44 26 45 26 48 C26 51 22 54 22 54 C22 54 18 51 18 48" fill="#FCA5A5" opacity="0.6"/>
  <path d="M74 48 C74 45 77 44 78 46 C79 44 82 45 82 48 C82 51 78 54 78 54 C78 54 74 51 74 48" fill="#FCA5A5" opacity="0.6"/>
  
  <!-- Happy open smile -->
  <path d="M42 55 Q50 65 58 55" stroke="#92400E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M44 56 Q50 62 56 56" fill="#FEE2E2"/>
  
  <!-- Sparkle decorations -->
  <g fill="#FDE047" opacity="0.8">
    <polygon points="12,32 13,35 16,35 14,37 15,40 12,38 9,40 10,37 8,35 11,35" transform="scale(0.7)"/>
    <polygon points="130,25 131,28 134,28 132,30 133,33 130,31 127,33 128,30 126,28 129,28" transform="scale(0.7)"/>
  </g>
  
  <!-- Body -->
  <rect x="28" y="67" width="44" height="33" rx="8" fill="url(#tunic3)"/>
  
  <!-- V-neck -->
  <path d="M38 67 L50 80 L62 67" fill="#5B21B6"/>
  <line x1="38" y1="67" x2="50" y2="80" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="62" y1="67" x2="50" y2="80" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Collar -->
  <line x1="28" y1="67" x2="38" y2="67" stroke="white" stroke-width="2.5"/>
  <line x1="62" y1="67" x2="72" y2="67" stroke="white" stroke-width="2.5"/>
  
  <!-- Sleeve bands -->
  <rect x="24" y="80" width="8" height="3" rx="1" fill="white"/>
  <rect x="68" y="80" width="8" height="3" rx="1" fill="white"/>
  
  <!-- Pocket lines -->
  <line x1="32" y1="92" x2="44" y2="92" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="92" x2="68" y2="92" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Cute hands -->
  <circle cx="22" cy="86" r="6" fill="url(#skin3)"/>
  <circle cx="78" cy="84" r="6" fill="url(#skin3)"/>
  <!-- Peace sign! -->
  <ellipse cx="82" cy="78" rx="2" ry="4" fill="url(#skin3)"/>
  <ellipse cx="78" cy="76" rx="2" ry="4.5" fill="url(#skin3)"/>
  
  <!-- Clipboard -->
  <g transform="translate(8, 80) rotate(-10)">
    <rect width="12" height="15" rx="2" fill="#E9D5FF"/>
    <rect x="3" y="-2" width="6" height="4" rx="1" fill="#FBBF24"/>
    <rect x="2" y="4" width="8" height="9" rx="1" fill="white"/>
    <path d="M4 7 L5 8 L7 5" stroke="#8B5CF6" stroke-width="1" fill="none"/>
    <path d="M4 10 L5 11 L7 8" stroke="#8B5CF6" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Feet -->
  <ellipse cx="40" cy="104" rx="7" ry="4" fill="#1F2937"/>
  <ellipse cx="60" cy="104" rx="7" ry="4" fill="#1F2937"/>
  <!-- Shoe shine -->
  <ellipse cx="38" cy="103" rx="2" ry="1" fill="white" opacity="0.2"/>
  <ellipse cx="58" cy="103" rx="2" ry="1" fill="white" opacity="0.2"/>
</svg>