<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <!-- VERSION 1: Ultra-chibi with HUGE eyes, tiny body -->
  <defs>
    <linearGradient id="tunic1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="hair1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7"/>
      <stop offset="100%" style="stop-color:#FCD34D"/>
    </linearGradient>
    <linearGradient id="skin1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF7ED"/>
      <stop offset="100%" style="stop-color:#FFEDD5"/>
    </linearGradient>
    <linearGradient id="eye1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7DD3FC"/>
      <stop offset="50%" style="stop-color:#38BDF8"/>
      <stop offset="100%" style="stop-color:#0284C7"/>
    </linearGradient>
  </defs>
  
  <!-- Hair puff back -->
  <ellipse cx="50" cy="20" rx="38" ry="16" fill="url(#hair1)"/>
  
  <!-- HUGE HEAD -->
  <circle cx="50" cy="36" r="34" fill="url(#skin1)"/>
  
  <!-- Fluffy bangs -->
  <ellipse cx="28" cy="14" rx="14" ry="12" fill="url(#hair1)"/>
  <ellipse cx="50" cy="10" rx="16" ry="13" fill="url(#hair1)"/>
  <ellipse cx="72" cy="14" rx="14" ry="12" fill="url(#hair1)"/>
  <ellipse cx="38" cy="16" rx="10" ry="9" fill="url(#hair1)"/>
  <ellipse cx="62" cy="16" rx="10" ry="9" fill="url(#hair1)"/>
  <!-- Hair shine -->
  <ellipse cx="40" cy="10" rx="6" ry="3" fill="white" opacity="0.6"/>
  <ellipse cx="60" cy="8" rx="5" ry="2" fill="white" opacity="0.6"/>
  
  <!-- HUGE KAWAII EYES -->
  <!-- Left -->
  <ellipse cx="34" cy="38" rx="13" ry="14" fill="white"/>
  <ellipse cx="36" cy="40" rx="10" ry="11" fill="url(#eye1)"/>
  <ellipse cx="37" cy="43" rx="5" ry="6" fill="#0369A1"/>
  <circle cx="42" cy="34" r="5" fill="white"/>
  <circle cx="32" cy="46" r="2.5" fill="white"/>
  <circle cx="43" cy="40" r="1.5" fill="white" opacity="0.8"/>
  
  <!-- Right -->
  <ellipse cx="66" cy="38" rx="13" ry="14" fill="white"/>
  <ellipse cx="68" cy="40" rx="10" ry="11" fill="url(#eye1)"/>
  <ellipse cx="69" cy="43" rx="5" ry="6" fill="#0369A1"/>
  <circle cx="74" cy="34" r="5" fill="white"/>
  <circle cx="64" cy="46" r="2.5" fill="white"/>
  <circle cx="75" cy="40" r="1.5" fill="white" opacity="0.8"/>
  
  <!-- Pink cheeks -->
  <ellipse cx="16" cy="46" rx="7" ry="5" fill="#FDA4AF" opacity="0.7"/>
  <ellipse cx="84" cy="46" rx="7" ry="5" fill="#FDA4AF" opacity="0.7"/>
  
  <!-- Cat smile :3 -->
  <path d="M42 56 Q44 54 47 56" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M53 56 Q56 54 58 56" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="50" cy="58" rx="2" ry="1" fill="#FECACA"/>
  
  <!-- TINY body -->
  <rect x="32" y="68" width="36" height="28" rx="6" fill="url(#tunic1)"/>
  
  <!-- V-neck -->
  <path d="M40 68 L50 78 L60 68" fill="#4338CA"/>
  <line x1="40" y1="68" x2="50" y2="78" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="68" x2="50" y2="78" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Tiny hands -->
  <circle cx="28" cy="82" r="5" fill="url(#skin1)"/>
  <circle cx="72" cy="80" r="5" fill="url(#skin1)"/>
  <!-- Wave fingers -->
  <ellipse cx="75" cy="74" rx="2" ry="3" fill="url(#skin1)"/>
  <ellipse cx="72" cy="73" rx="2" ry="3" fill="url(#skin1)"/>
  
  <!-- Mini clipboard -->
  <rect x="18" y="76" width="10" height="13" rx="2" fill="#C7D2FE"/>
  <rect x="21" y="74" width="4" height="3" rx="1" fill="#FBBF24"/>
  <rect x="19" y="79" width="8" height="8" rx="1" fill="white"/>
  
  <!-- Tiny feet -->
  <ellipse cx="42" cy="100" rx="6" ry="3" fill="#374151"/>
  <ellipse cx="58" cy="100" rx="6" ry="3" fill="#374151"/>
</svg>