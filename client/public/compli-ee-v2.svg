<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <!-- VERSION 2: Soft pastel, star eyes, gentle smile -->
  <defs>
    <linearGradient id="tunic2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
    <linearGradient id="hair2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFBEB"/>
      <stop offset="100%" style="stop-color:#FDE68A"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF1E6"/>
      <stop offset="100%" style="stop-color:#FFE4D6"/>
    </linearGradient>
    <linearGradient id="eye2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A5F3FC"/>
      <stop offset="50%" style="stop-color:#22D3EE"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>
  
  <!-- Soft hair back -->
  <ellipse cx="50" cy="22" rx="36" ry="17" fill="url(#hair2)"/>
  <ellipse cx="22" cy="30" rx="10" ry="14" fill="url(#hair2)"/>
  <ellipse cx="78" cy="30" rx="10" ry="14" fill="url(#hair2)"/>
  
  <!-- Round precious head -->
  <circle cx="50" cy="38" r="32" fill="url(#skin2)"/>
  
  <!-- Soft swoopy bangs -->
  <path d="M18 30 Q22 12 38 10 Q50 8 62 10 Q78 12 82 30 Q75 20 50 18 Q25 20 18 30 Z" fill="url(#hair2)"/>
  <ellipse cx="30" cy="16" rx="12" ry="10" fill="url(#hair2)"/>
  <ellipse cx="50" cy="12" rx="14" ry="11" fill="url(#hair2)"/>
  <ellipse cx="70" cy="16" rx="12" ry="10" fill="url(#hair2)"/>
  <!-- Hair highlights -->
  <path d="M35 12 Q40 8 45 14" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M55 10 Q60 6 65 12" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Sparkly cyan eyes -->
  <!-- Left -->
  <ellipse cx="36" cy="40" rx="12" ry="13" fill="white"/>
  <ellipse cx="38" cy="42" rx="9" ry="10" fill="url(#eye2)"/>
  <circle cx="38" cy="44" r="4" fill="#0891B2"/>
  <!-- Star sparkle! -->
  <polygon points="44,34 45,37 48,37 46,39 47,42 44,40 41,42 42,39 40,37 43,37" fill="white"/>
  <circle cx="34" cy="47" r="2" fill="white"/>
  
  <!-- Right -->
  <ellipse cx="64" cy="40" rx="12" ry="13" fill="white"/>
  <ellipse cx="66" cy="42" rx="9" ry="10" fill="url(#eye2)"/>
  <circle cx="66" cy="44" r="4" fill="#0891B2"/>
  <!-- Star sparkle! -->
  <polygon points="72,34 73,37 76,37 74,39 75,42 72,40 69,42 70,39 68,37 71,37" fill="white"/>
  <circle cx="62" cy="47" r="2" fill="white"/>
  
  <!-- Soft peach blush -->
  <ellipse cx="20" cy="50" rx="6" ry="4" fill="#FEC8B8" opacity="0.6"/>
  <ellipse cx="80" cy="50" rx="6" ry="4" fill="#FEC8B8" opacity="0.6"/>
  
  <!-- Gentle happy smile -->
  <path d="M42 56 Q50 64 58 56" stroke="#B45309" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Tunic body -->
  <rect x="28" y="68" width="44" height="32" rx="7" fill="url(#tunic2)"/>
  
  <!-- V-neck with white trim -->
  <path d="M38 68 L50 80 L62 68" fill="#5B21B6"/>
  <line x1="38" y1="68" x2="50" y2="80" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="62" y1="68" x2="50" y2="80" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Collar line -->
  <line x1="28" y1="68" x2="38" y2="68" stroke="white" stroke-width="2"/>
  <line x1="62" y1="68" x2="72" y2="68" stroke="white" stroke-width="2"/>
  
  <!-- Pocket trim -->
  <line x1="32" y1="90" x2="44" y2="90" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="90" x2="68" y2="90" stroke="white" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Cute hands -->
  <circle cx="24" cy="84" r="6" fill="url(#skin2)"/>
  <circle cx="76" cy="82" r="6" fill="url(#skin2)"/>
  <!-- Thumbs up! -->
  <ellipse cx="80" cy="76" rx="2.5" ry="4" fill="url(#skin2)"/>
  
  <!-- Clipboard -->
  <g transform="translate(10, 78) rotate(-12)">
    <rect width="12" height="16" rx="2" fill="#DDD6FE"/>
    <rect x="3" y="-2" width="6" height="4" rx="1" fill="#FBBF24"/>
    <rect x="2" y="4" width="8" height="10" rx="1" fill="white"/>
    <path d="M4 7 L5 8 L7 5" stroke="#7C3AED" stroke-width="1" fill="none"/>
    <path d="M4 11 L5 12 L7 9" stroke="#7C3AED" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Feet -->
  <ellipse cx="40" cy="104" rx="7" ry="4" fill="#1F2937"/>
  <ellipse cx="60" cy="104" rx="7" ry="4" fill="#1F2937"/>
</svg>