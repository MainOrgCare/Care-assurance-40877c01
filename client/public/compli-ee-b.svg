<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100">
  <!-- STYLE B: Soft rounded cartoon - like a friendly app icon -->
  
  <!-- Soft shadow -->
  <ellipse cx="40" cy="96" rx="20" ry="4" fill="#E5E7EB"/>
  
  <!-- Body first (behind head) -->
  <rect x="22" y="58" width="36" height="34" rx="8" fill="#4F46E5"/>
  <path d="M30 58 L40 70 L50 58" fill="#3730A3"/>
  <line x1="30" y1="58" x2="40" y2="70" stroke="white" stroke-width="3"/>
  <line x1="50" y1="58" x2="40" y2="70" stroke="white" stroke-width="1.5"/>
  
  <!-- Big round head -->
  <circle cx="40" cy="34" r="30" fill="#FFECD2"/>
  
  <!-- Soft hair shape -->
  <ellipse cx="40" cy="18" rx="26" ry="14" fill="#FFD93D"/>
  <ellipse cx="20" cy="24" rx="10" ry="12" fill="#FFD93D"/>
  <ellipse cx="60" cy="24" rx="10" ry="12" fill="#FFD93D"/>
  <path d="M14 32 Q20 14 40 12 Q60 14 66 32 Q54 22 40 20 Q26 22 14 32 Z" fill="#FFD93D"/>
  
  <!-- Dot eyes - simple and clean -->
  <circle cx="28" cy="38" r="4" fill="#1E293B"/>
  <circle cx="52" cy="38" r="4" fill="#1E293B"/>
  <circle cx="30" cy="36" r="1.5" fill="white"/>
  <circle cx="54" cy="36" r="1.5" fill="white"/>
  
  <!-- Soft blush -->
  <circle cx="18" cy="44" r="5" fill="#FEC5BB" opacity="0.4"/>
  <circle cx="62" cy="44" r="5" fill="#FEC5BB" opacity="0.4"/>
  
  <!-- Gentle smile -->
  <path d="M34 50 Q40 56 46 50" stroke="#92400E" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Simple hands -->
  <circle cx="18" cy="72" r="5" fill="#FFECD2"/>
  <circle cx="62" cy="70" r="5" fill="#FFECD2"/>
  
  <!-- Mini clipboard -->
  <rect x="8" y="66" width="10" height="13" rx="2" fill="#C7D2FE"/>
  <rect x="11" y="64" width="4" height="3" rx="1" fill="#FBBF24"/>
  
  <!-- Feet -->
  <ellipse cx="32" cy="94" rx="6" ry="3" fill="#374151"/>
  <ellipse cx="48" cy="94" rx="6" ry="3" fill="#374151"/>
</svg>