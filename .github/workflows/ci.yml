name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run tests
        run: npm run test
      - name: Type check
        run: npm run check
      - name: Build client
        run: npm run build:client
      - name: Build API server
        run: npm run build:server
      - name: Build worker
        run: npm run build:worker
